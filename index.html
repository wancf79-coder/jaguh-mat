<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f5fe0">
<meta name="description" content="Jaguh Matematik oleh Jaguh Sekolah — game Matematik KSSR Tahun 1 hingga 3, bab demi bab dengan kuiz dan papan skor online.">
<title>Jaguh Matematik · Jaguh Sekolah</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150"%3E%3Cellipse cx="17" cy="80" rx="6.5" ry="12" transform="rotate%28-15 17 80%29" fill="%232BB673"/%3E%3Cellipse cx="14" cy="98" rx="6.5" ry="12" transform="rotate%28-38 14 98%29" fill="%2325A566"/%3E%3Cellipse cx="20" cy="115" rx="6.5" ry="12" transform="rotate%28-58 20 115%29" fill="%232BB673"/%3E%3Cellipse cx="32" cy="128" rx="6.5" ry="12" transform="rotate%28-76 32 128%29" fill="%2325A566"/%3E%3Cellipse cx="123" cy="80" rx="6.5" ry="12" transform="rotate%2815 123 80%29" fill="%232BB673"/%3E%3Cellipse cx="126" cy="98" rx="6.5" ry="12" transform="rotate%2838 126 98%29" fill="%2325A566"/%3E%3Cellipse cx="120" cy="115" rx="6.5" ry="12" transform="rotate%2858 120 115%29" fill="%232BB673"/%3E%3Cellipse cx="108" cy="128" rx="6.5" ry="12" transform="rotate%2876 108 128%29" fill="%2325A566"/%3E%3Cpath d="M70 8 L116 24 V66 C116 102 95 126 70 140 C45 126 24 102 24 66 V24 Z" fill="%23123A8F"/%3E%3Cpath d="M70 16 L108 29.5 V66 C108 97 90 118 70 130.5 C50 118 32 97 32 66 V29.5 Z" fill="%231F5FE0"/%3E%3Cpath d="M70 16 L32 29.5 V66 C32 97 50 118 70 130.5 Z" fill="%233D7BF0"/%3E%3Cpath d="M44 31.5 Q44 36 48.5 36 Q44 36 44 40.5 Q44 36 39.5 36 Q44 36 44 31.5 Z" fill="%23FFFFFF"/%3E%3Cpath d="M98 36.5 Q98 40 101.5 40 Q98 40 98 43.5 Q98 40 94.5 40 Q98 40 98 36.5 Z" fill="%23BFD4FF"/%3E%3Cpath d="M70 33 L76.8 50.7 L95.7 51.7 L80.9 63.6 L85.9 81.8 L70 71.5 L54.1 81.8 L59.1 63.6 L44.3 51.7 L63.2 50.7 Z" fill="%23FFC93C" stroke="%23FFC93C" stroke-width="7" stroke-linejoin="round"/%3E%3Cpath d="M70 71.5 L85.9 81.8 L80.9 63.6 L95.7 51.7 L76.8 50.7 L70 33 Z" fill="%23FFB020" stroke="%23FFB020" stroke-width="7" stroke-linejoin="round" opacity=".55"/%3E%3Cellipse cx="62" cy="52" rx="3.2" ry="5" transform="rotate%2830 62 52%29" fill="%23FFFFFF" opacity=".85"/%3E%3Cpath d="M40 96 Q55 88 70 96 V114 Q55 106 40 114 Z" fill="%23FFFFFF"/%3E%3Cpath d="M70 96 Q85 88 100 96 V114 Q85 106 70 114 Z" fill="%23E3ECFF"/%3E%3Cpath d="M46 99 Q55 95 64 99 M46 104 Q55 100 64 104 M76 99 Q85 95 94 99 M76 104 Q85 100 94 104" fill="none" stroke="%239DB8F2" stroke-width="1.6" stroke-linecap="round"/%3E%3Cpath d="M70 96 V114" stroke="%23123A8F" stroke-width="2.4" stroke-linecap="round"/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: riang, jelas, untuk murid 7–9 tahun
   IDEA: blok nombor mainan dan kad kuiz besar
   PICTURE: soalan + gambar besar di tengah; blok 1-2-3 di laman utama
   COLOUR and TYPE: biru langit, kuning matahari, warna tahun oren/hijau laut/ungu; Baloo 2 + Nunito
   LAYOUT: satu lajur ≤720px, butang 2×2 besar untuk jawapan */
:root{color-scheme:light dark;
 --bg:light-dark(#e8f3ff,#0e1630);--card:light-dark(#ffffff,#18224a);--ink:light-dark(#18233f,#eef2ff);--mut:light-dark(#5b6787,#a9b4d6);
 --line:light-dark(#d6e2f5,#2b3766);--pri:#1f5fe0;--sun:#ffc83d;--ok:#16a765;--bad:#e5484d;--c:#1f5fe0;
 --soft:light-dark(#f3f8ff,#121b3d);--vis:#ffffff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
.wrap{max-width:720px;margin:0 auto;padding:16px max(4vw,14px) 48px}

/* top bar */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px max(4vw,14px);background:var(--pri);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;gap:8px;font:800 22px/1 "Baloo 2",sans-serif;color:#fff;margin-right:auto;min-height:44px}
.brand svg{width:36px;height:39px;flex:none}
.brand .bn{display:flex;flex-direction:column;align-items:flex-start;line-height:.95}
.brand .bn b{font:800 21px/1 "Baloo 2",sans-serif;color:#fff}.brand .bn i{font-style:normal;color:#ffc93c}
.brand .bn small{font:800 11px/1.2 Nunito,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#d6e3ff}
.hbrand{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 14px 5px 6px;margin-bottom:8px;font:800 15px/1 "Baloo 2",sans-serif}
.hbrand svg{width:26px;height:28px}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.14)}
.ic svg{width:24px;height:24px}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:flex;background:rgba(255,255,255,.16);border-radius:12px;padding:3px}
.lang button{min-width:44px;height:38px;border-radius:9px;font-weight:800;color:#fff;opacity:.8}
.lang button.on{background:#fff;color:var(--pri);opacity:1}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center;gap:12px;background:var(--pri);color:#fff;margin:-16px calc(-1*max(4vw,14px)) 18px;padding:18px max(4vw,14px) 22px;border-radius:0 0 28px 28px}
.hero h1{font-size:clamp(40px,9vw,58px)}
.hero p{margin:6px 0 0;font-weight:700;opacity:.92}
.hpic{width:100%;max-height:190px}
.hello{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:18px;padding:12px 16px;margin-bottom:14px;box-shadow:0 3px 0 var(--line)}
.hello b{display:block;font-size:20px}.hello small{color:var(--mut);font-weight:700}
.namef{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:14px;box-shadow:0 3px 0 var(--line)}
.namef label{font-weight:800;display:block;margin-bottom:8px}
.row{display:flex;gap:8px}.row input{flex:1}
input,select{min-height:48px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--soft);font-size:16px;width:100%}
.yrs{display:grid;gap:12px;margin-bottom:16px}
.yr{display:grid;grid-template-columns:64px minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;column-gap:14px;row-gap:8px;text-align:left;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 var(--c);border:2px solid var(--c);transition:transform .12s}
.yr:active{transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.yn{grid-row:1/3;width:64px;height:64px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 40px/1 "Baloo 2",sans-serif}
.yt b{font:800 24px/1.1 "Baloo 2",sans-serif;display:block}.yt small{color:var(--mut);font-weight:700}
.pc{font-weight:800;color:var(--c)}
.meter{grid-column:2/4;height:10px;border-radius:9px;background:var(--soft);overflow:hidden}
.meter i,.prog i,.timer i{display:block;height:100%;background:var(--c);border-radius:9px}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.btn{min-height:48px;padding:10px 18px;border-radius:14px;background:var(--pri);color:#fff;font-weight:800;box-shadow:0 4px 0 #123a8f}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #123a8f}.btn:disabled{opacity:.6}
.btn.big{min-height:56px;font-size:19px;width:100%}
.btn.alt{background:var(--sun);color:#3a2a00;box-shadow:0 4px 0 #c08a00}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.link{color:var(--pri);font-weight:800;text-decoration:underline;min-height:44px;padding:0 6px}
:root[data-theme=dark] .link{color:#8fb3ff}

/* tahun & bab */
.ttl{font-size:clamp(32px,7vw,44px);color:var(--c);margin:6px 0 14px}
.crumb{margin:4px 0 0;font-weight:800;color:var(--mut)}
.babs{display:grid;gap:10px}
.bab{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border-radius:18px;padding:12px 14px;min-height:72px;box-shadow:0 4px 0 var(--line);border-left:8px solid var(--c)}
.bab .bn{flex:none;width:58px;height:58px;border-radius:16px;flex-direction:column;line-height:.9;background:var(--c);color:#fff;display:grid;place-items:center;font:800 24px/1 "Baloo 2",sans-serif}
.bab .bt{flex:1}.bab b{display:block;font-size:18px;line-height:1.25}.bab small{color:var(--mut);font-weight:700}
.bab.lock{opacity:.55;cursor:not-allowed}.bab.lock .bn{background:var(--mut)}
.lk{width:22px;height:22px;color:var(--mut)}
.tog{display:flex;align-items:center;gap:10px;margin-top:18px;font-weight:700;color:var(--mut);min-height:44px}
.tog input{width:24px;height:24px;min-height:0;accent-color:var(--pri)}
.path{list-style:none;margin:0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:31px;top:30px;bottom:30px;width:6px;border-radius:3px;background:var(--line)}
.path li{position:relative;margin-bottom:12px}
.path button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:10px 14px 10px 8px;min-height:76px;box-shadow:0 4px 0 var(--line)}
.dot{flex:none;width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:800 26px/1 "Baloo 2",sans-serif;border:4px solid var(--card);box-shadow:0 0 0 3px var(--c)}
.dot svg{width:26px;height:26px}
.sl{flex:1}.sl small{display:block;color:var(--mut);font-weight:700;font-size:14px}.sl b{display:block;font-size:18px;line-height:1.25}
.path li.lock button{opacity:.55;cursor:not-allowed}.path li.lock .dot{background:var(--mut);box-shadow:0 0 0 3px var(--mut)}
.path li.quiz button{border:3px solid var(--sun);background:light-dark(#fffaf0,#2a2a46)}
.path li.quiz .dot{background:var(--soft);box-shadow:0 0 0 3px var(--sun)}
.stars{display:inline-flex;gap:2px;flex:none}
.stars svg{width:22px;height:22px;fill:var(--line);stroke:light-dark(#b9c6de,#3a4778)}
.stars svg.on{fill:var(--sun);stroke:#a16207}

/* main */
.play .ph{display:flex;justify-content:space-between;font-weight:800;color:var(--mut);margin-bottom:6px}
.pts{color:var(--c)}
.prog,.timer{height:10px;background:light-dark(#d9e6f8,#25305c);border-radius:9px;overflow:hidden;margin-bottom:8px}
.timer{height:8px}.timer i{background:var(--sun);transition:width .1s linear}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 5px 0 var(--line);margin:8px 0 14px}
.qt{font-size:clamp(19px,4.6vw,23px);font-weight:800;margin:0;line-height:1.35}
.eq{font:800 clamp(36px,10vw,56px)/1.1 "Baloo 2",sans-serif;margin:12px 0 2px;text-align:center;color:var(--c);overflow-wrap:anywhere}
.vbox{margin-top:12px;background:var(--vis);border-radius:16px;padding:12px;display:flex;justify-content:center;color:#18233f}
.vis{width:100%;height:auto;display:block;font-family:Nunito,sans-serif}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.wide{grid-template-columns:minmax(0,1fr)}
.opt{min-height:68px;border-radius:18px;background:var(--card);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);font:800 clamp(20px,5.2vw,26px)/1.2 "Baloo 2",Nunito,sans-serif;padding:10px 12px;transition:transform .1s}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 5px 0 #0c6b40}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 5px 0 #8f1f22}
.opt.dim{opacity:.45}
.fb{position:sticky;bottom:10px;margin-top:14px;border-radius:18px;padding:12px 12px 12px 16px;color:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px rgba(0,0,0,.18);animation:pop .22s ease-out}
.fb.good{background:var(--ok)}.fb.bad{background:#d9534f}
.fb b{font:800 22px/1.2 "Baloo 2",sans-serif}.fb small{opacity:.85;font-weight:700}
.fb strong{font-size:20px}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .1em}
.fr b{display:block;padding:0 .12em;font-weight:inherit}.fr b:first-child{border-bottom:.08em solid currentColor;padding-bottom:.06em}.fr b+b{padding-top:.06em}
.picto{width:100%;max-width:440px;font-weight:700}
.pt{font-weight:800;margin-bottom:6px;text-align:center}
.pr{display:grid;grid-template-columns:88px minmax(0,1fr);align-items:center;border-top:1px solid #d6e2f5;padding:6px 0}
.pn{font-weight:800}.pi{display:flex;flex-wrap:wrap;gap:3px}.pi svg,.pk svg{width:26px;height:26px}
.pk{display:flex;gap:8px;align-items:center;border-top:2px solid #18233f;padding-top:8px;margin-top:4px;font-size:15px}

/* keputusan */
.center{text-align:center}
.bigstars .stars svg{width:62px;height:62px}
.res h2{font-size:clamp(34px,8vw,48px);color:var(--c);margin:6px 0}
.sc{font-size:22px;margin:4px 0}.sc b{font-size:34px;font-family:"Baloo 2",sans-serif}
.pts.big{font:800 28px/1.2 "Baloo 2",sans-serif;margin:4px 0}
.pts em{display:inline-block;font-style:normal;background:var(--sun);color:#3a2a00;border-radius:9px;padding:2px 10px;font-size:16px;vertical-align:middle}
.note{color:var(--mut);font-weight:700}.note.ok{color:var(--ok)}

/* papan skor */
.tabs,.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;box-shadow:0 3px 0 var(--line);margin-bottom:14px}
.tabs button,.seg button{flex:1;min-height:44px;border-radius:10px;font-weight:800;color:var(--mut)}
.tabs button.on,.seg button.on{background:var(--pri);color:#fff}
.seg{margin:0;box-shadow:none;border:2px solid var(--line)}
.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.filters .seg,.filters .tog{grid-column:1/-1;margin:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.kpis div{background:var(--card);border-radius:16px;padding:12px;text-align:center;box-shadow:0 3px 0 var(--line)}
.kpis b{display:block;font:800 clamp(24px,6vw,32px)/1.1 "Baloo 2",sans-serif;color:var(--pri)}.kpis small{color:var(--mut);font-weight:700}
h3{font-size:22px;margin:18px 0 8px;color:var(--c)}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:15px}
.tbl td{padding:9px 12px;border-top:1px solid var(--line)}.tbl tr:first-child td{border-top:0}
.tbl .r{text-align:right;white-space:nowrap;font-weight:800}.tbl .s{color:var(--mut)}
.hist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:0 3px 0 var(--line)}
.hist b{font-size:20px;color:var(--pri);text-align:right}.hist small{color:var(--mut);grid-column:1/-1}
.lb{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.lb li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 3px 0 var(--line)}
.lb .rk{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 20px/1 "Baloo 2",sans-serif;background:var(--soft)}
.lb .top1 .rk{background:#ffc83d;color:#3a2a00}.lb .top2 .rk{background:#cfd8e6;color:#24345a}.lb .top3 .rk{background:#e9a26b;color:#3a1d00}
.lb .who b{display:block;font-size:18px}.lb .who small{color:var(--mut);font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .pt{font:800 22px/1 "Baloo 2",sans-serif;color:var(--pri);white-space:nowrap}
.lb li.me{border:3px solid var(--sun)}
.myrank{background:var(--sun);color:#3a2a00;border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:12px}
.cta{margin-top:16px;background:var(--card);border-radius:18px;padding:14px 16px;border:2px dashed var(--pri);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cta p{flex:1 1 220px;margin:0;font-weight:700}

/* borang */
.form{display:grid;gap:12px}
.form label{display:grid;gap:6px;font-weight:800}
.hint{color:var(--mut);font-size:15px;margin:0}
.err{color:var(--bad);font-weight:800;margin:0;min-height:1em}
.who1{font:800 28px/1.1 "Baloo 2",sans-serif;margin:0 0 12px;color:var(--pri)}

@media(max-width:600px){
 .hero{grid-template-columns:minmax(0,1fr);text-align:left}.hpic{max-height:130px}
 .opt{min-height:62px}
 .filters{grid-template-columns:minmax(0,1fr)}
 .tbl{font-size:14px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.yr .yt{grid-column:2;grid-row:1}.yr .pc{grid-column:3;grid-row:1}.yr .meter{grid-column:2/4;grid-row:2}

.bab .bn{display:flex;align-items:center;justify-content:center}.bab .bn small{display:block;color:#fff;font:800 12px/1 Nunito,sans-serif;opacity:.95;margin-bottom:2px}

.qrow{display:flex;gap:10px;align-items:flex-start}.qrow .qt{flex:1}
.say{flex:none;width:48px;height:48px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.18)}.say svg{width:26px;height:26px}

.pcrumb{margin:0 0 10px;color:var(--mut);font-weight:700;font-size:15px;line-height:1.35}.pcrumb b{color:var(--c);font-size:18px;font-family:"Baloo 2",Nunito,sans-serif}
.say.busy{animation:pulse 1s ease-in-out infinite}.say.off{background:var(--mut)}
@keyframes pulse{50%{opacity:.45}}
.vnote{margin:10px 0 0;font-size:14px;font-weight:700;color:var(--bad)}

.fb>div{flex:1;display:grid;gap:2px}
.nx{flex:none;width:64px;height:64px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.2)}
:root[data-theme=dark] .nx{color:#18233f}
.nx svg{width:34px;height:34px}.fb.good .nx{color:var(--ok)}.fb.bad .nx{color:#c13f3b}
.ph{align-items:center;gap:10px}.ph .pq{flex:1}.ph .pq em{font-style:normal;background:var(--sun);color:#3a2a00;border-radius:8px;padding:1px 8px;font-size:13px;margin-left:4px}
.arw{width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--c);display:grid;place-items:center;box-shadow:0 3px 0 var(--line);flex:none}
.arw svg{width:24px;height:24px}.arw:disabled{opacity:.3;cursor:default}
.opt[aria-disabled=true]{cursor:default}
.opts.pics .opt{padding:8px;min-height:110px;display:grid;place-items:center}.opts.pics .opt svg{width:100%;max-width:150px;height:auto}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<script>
{
/* ===== Jaguh Mat — penjana soalan (KSSR Semakan 2017, Tahun 1–3) ===== */
const T=(ms,en)=>({ms,en});
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmtN=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const pad=n=>String(n).padStart(2,'0');
const okey=d=>typeof d==='object'?d.ms+'|'+d.en:String(d);
const near=(n,ds,lo=0,hi=1e9)=>ds.map(d=>n+d).filter(x=>x>=lo&&x<=hi&&x!==n);

function mc(base,ans,cands,fmt){
  fmt=fmt||(x=>typeof x==='number'?fmtN(x):x);
  const out=[ans],seen=new Set([okey(fmt(ans))]);
  for(const c of shuf(cands)){
    if(out.length>=4)break;
    if(c==null||(typeof c==='number'&&(c<0||!isFinite(c))))continue;
    const k=okey(fmt(c));if(!seen.has(k)){seen.add(k);out.push(c)}
  }
  const o=shuf(out);
  return Object.assign({q:'',eq:'',vis:''},base,{opts:o.map(fmt),ans:o.indexOf(ans)});
}

/* ---------- perkataan nombor ---------- */
const WMS=['kosong','satu','dua','tiga','empat','lima','enam','tujuh','lapan','sembilan'];
function wMs(n){
  if(n<10)return WMS[n];if(n===10)return'sepuluh';if(n===11)return'sebelas';
  if(n<20)return WMS[n-10]+' belas';
  if(n<100){const o=n%10;return WMS[Math.floor(n/10)]+' puluh'+(o?' '+WMS[o]:'')}
  if(n<1000){const h=Math.floor(n/100),r=n%100;return(h===1?'seratus':WMS[h]+' ratus')+(r?' '+wMs(r):'')}
  const th=Math.floor(n/1000),r=n%1000;return(th===1?'seribu':wMs(th)+' ribu')+(r?' '+wMs(r):'');
}
const WEN=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TEN=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function wEn(n){
  if(n<20)return WEN[n];
  if(n<100)return TEN[Math.floor(n/10)]+(n%10?'-'+WEN[n%10]:'');
  if(n<1000)return WEN[Math.floor(n/100)]+' hundred'+(n%100?' and '+wEn(n%100):'');
  const r=n%1000;return wEn(Math.floor(n/1000))+' thousand'+(r?(r<100?' and ':' ')+wEn(r):'');
}
const NW=n=>T(wMs(n),wEn(n));

/* ---------- data umum ---------- */
const NAMES=['Ali','Siti','Muthu','Mei Ling','Aiman','Kavitha','Jun Wei','Aisyah','Ravi','Nurul','Danish','Farah'];
const THINGS=[T('guli','marbles'),T('buku','books'),T('pensel','pencils'),T('gula-gula','sweets'),T('setem','stamps'),T('kad','cards'),T('belon','balloons'),T('manik','beads'),T('biskut','biscuits')];
const ITEMS=[{id:'apple',t:T('epal','apples')},{id:'star',t:T('bintang','stars')},{id:'ball',t:T('bola','balls')},{id:'fish',t:T('ikan','fish')}];
const two=()=>{const a=pick(NAMES);let b=pick(NAMES);while(b===a)b=pick(NAMES);return[a,b]};
const DAYS=[T('Isnin','Monday'),T('Selasa','Tuesday'),T('Rabu','Wednesday'),T('Khamis','Thursday'),T('Jumaat','Friday'),T('Sabtu','Saturday'),T('Ahad','Sunday')];
const MONTHS=[T('Januari','January'),T('Februari','February'),T('Mac','March'),T('April','April'),T('Mei','May'),T('Jun','June'),T('Julai','July'),T('Ogos','August'),T('September','September'),T('Oktober','October'),T('November','November'),T('Disember','December')];
const MDAYS=[31,28,31,30,31,30,31,31,30,31,30,31];
const PLACE=[T('sa','ones'),T('puluh','tens'),T('ratus','hundreds'),T('ribu','thousands')];
const ORD=n=>T('ke-'+n,['','1st','2nd','3rd'][n]||n+'th');

/* ---------- SVG ---------- */
const svg=(w,h,inner,mw)=>`<svg class="vis" viewBox="0 0 ${w} ${h}" style="max-width:${mw||Math.min(w*1.3,480)}px" role="img">${inner}</svg>`;
const SHADE='#ff8a3d',LIGHT='#fff3e8',EDGE='#8a3b0c';
const FILLS=['#ff8a3d','#3b82f6','#22b573','#a66cff','#f2b705','#ef5b8c'];

function objs(n,kind){
  const per=n>10?10:n,s=38,gap=per>5?10:0;let g='';
  for(let i=0;i<n;i++){const r=Math.floor(i/per),c=i%per;g+=`<use href="#i-${kind}" x="${c*s+(c>=5?gap:0)+3}" y="${r*s+3}" width="32" height="32"/>`}
  return svg(per*s+gap,Math.ceil(n/per)*s,g);
}
function rods(t,o){
  let g='',x=4;
  for(let i=0;i<t;i++){g+=`<g transform="translate(${x},4)"><rect width="18" height="150" rx="3" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>${[...Array(9)].map((_,k)=>`<line x1="0" x2="18" y1="${15*(k+1)}" y2="${15*(k+1)}" stroke="#1e3a8a" stroke-width="1.4"/>`).join('')}</g>`;x+=24}
  x+=10;for(let i=0;i<o;i++){const c=i%2,r=Math.floor(i/2);g+=`<rect x="${x+c*19}" y="${141-r*19}" width="15" height="15" rx="2" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>`}
  return svg(x+(o?42:0),160,g);
}
const FRC=[['#ff8a3d','#fff3e8','#8a3b0c'],['#3b82f6','#eaf2ff','#1e3a8a'],['#22b573','#eafaf1','#145c3a'],['#a66cff','#f4efff','#4b2a8f'],['#ef5b8c','#fff0f5','#8f1d45'],['#f2b705','#fff9e0','#7a5a00']];
function fracSvg(den,num,kind,o){
  o=o||{};const C=o.c||pick(FRC),[S,L,E]=C,sh=new Set(o.rand?shuf([...Array(den).keys()]).slice(0,num):[...Array(num).keys()]);let p='';
  if(kind==='grid'&&den%2===0&&den>=4){const cols=den/2,w=Math.min(56,240/cols);
    for(let i=0;i<den;i++){const r=Math.floor(i/cols),c=i%cols;p+=`<rect x="${4+c*w}" y="${4+r*w}" width="${w}" height="${w}" fill="${sh.has(i)?S:L}" stroke="${E}" stroke-width="2.5"/>`}
    return svg(cols*w+8,2*w+8,p,o.mw||Math.min((cols*w+8)*1.3,300))}
  if(kind==='col'){const h=Math.min(40,200/den);for(let i=0;i<den;i++)p+=`<rect x="4" y="${4+i*h}" width="90" height="${h}" fill="${sh.has(i)?S:L}" stroke="${E}" stroke-width="2.5"/>`;return svg(98,den*h+8,p,o.mw||140)}
  if(kind==='circle'){const r=70,c=80,rot=o.rand?pick([0,45,90,180]):0;
    if(den===1)return svg(160,160,`<circle cx="80" cy="80" r="70" fill="${num?S:L}" stroke="${E}" stroke-width="2.5"/>`,o.mw||190);
    for(let i=0;i<den;i++){const a0=(rot-90+i*360/den)*Math.PI/180,a1=a0+2*Math.PI/den;
      p+=`<path d="M${c} ${c}L${(c+r*Math.cos(a0)).toFixed(1)} ${(c+r*Math.sin(a0)).toFixed(1)}A${r} ${r} 0 0 1 ${(c+r*Math.cos(a1)).toFixed(1)} ${(c+r*Math.sin(a1)).toFixed(1)}Z" fill="${sh.has(i)?S:L}" stroke="${E}" stroke-width="2.5"/>`}
    return svg(160,160,p,o.mw||190)}
  const w=Math.min(48,260/den);
  for(let i=0;i<den;i++)p+=`<rect x="${4+i*w}" y="4" width="${w}" height="80" fill="${sh.has(i)?S:L}" stroke="${E}" stroke-width="2.5"/>`;
  return svg(w*den+8,88,p,o.mw);
}
const FKINDS=den=>den%2===0&&den>=4?['circle','rect','col','grid']:['circle','rect','col'];
function strip10(n){let p='';for(let i=0;i<10;i++)p+=`<rect x="${4+i*28}" y="4" width="28" height="44" fill="${i<n?'#22b573':'#eefaf3'}" stroke="#145c3a" stroke-width="2"/>`;return svg(288,52,p)}
function grid100(n){let p='';for(let i=0;i<100;i++){const r=Math.floor(i/10),c=i%10;p+=`<rect x="${3+c*17}" y="${3+r*17}" width="17" height="17" fill="${i<n?'#a66cff':'#f4efff'}" stroke="#4b2a8f" stroke-width="1.2"/>`}return svg(176,176,p,220)}

function clockSvg(h,m){
  let s='<circle cx="100" cy="100" r="92" fill="#fff" stroke="#24345a" stroke-width="7"/>';
  for(let i=0;i<60;i++){const a=i*Math.PI/30,big=i%5===0,r1=big?76:82;s+=`<line x1="${(100+r1*Math.sin(a)).toFixed(1)}" y1="${(100-r1*Math.cos(a)).toFixed(1)}" x2="${(100+87*Math.sin(a)).toFixed(1)}" y2="${(100-87*Math.cos(a)).toFixed(1)}" stroke="#24345a" stroke-width="${big?3:1.3}"/>`}
  for(let n=1;n<=12;n++){const a=n*Math.PI/6;s+=`<text x="${(100+62*Math.sin(a)).toFixed(1)}" y="${(100-62*Math.cos(a)+7).toFixed(1)}" text-anchor="middle" font-size="19" font-weight="800" fill="#24345a">${n}</text>`}
  const ha=((h%12)+m/60)*30,ma=m*6;
  s+=`<line x1="100" y1="100" x2="100" y2="54" stroke="#e5484d" stroke-width="8" stroke-linecap="round" transform="rotate(${ha} 100 100)"/>`;
  s+=`<line x1="100" y1="100" x2="100" y2="28" stroke="#24345a" stroke-width="5" stroke-linecap="round" transform="rotate(${ma} 100 100)"/>`;
  return svg(200,200,s+'<circle cx="100" cy="100" r="7" fill="#24345a"/>',210);
}

const NOTE_C={1:'#3d6fd6',5:'#2f9e5c',10:'#d9443f',20:'#e98b2a',50:'#1c8c8a',100:'#7b4fc4'};
function moneySvg(items){
  let x=0,y=0,g='',rowH=0,maxX=0;const W=470;
  for(const it of items){
    const w=it.n?112:(it.v>=50?60:it.v>=20?54:it.v>=10?48:42),h=it.n?58:w;
    if(x+w>W){x=0;y+=rowH+10;rowH=0}
    if(it.n)g+=`<g transform="translate(${x},${y})"><rect width="112" height="58" rx="6" fill="${NOTE_C[it.v]}"/><rect x="5" y="5" width="102" height="48" rx="4" fill="none" stroke="#fff" stroke-opacity=".55"/><circle cx="86" cy="29" r="17" fill="#fff" fill-opacity=".22"/><text x="12" y="37" font-size="21" font-weight="800" fill="#fff">RM${it.v}</text></g>`;
    else{const r=w/2;g+=`<g transform="translate(${x+r},${y+r})"><circle r="${r}" fill="#d5dbe3" stroke="#8792a2" stroke-width="3"/><circle r="${r-6}" fill="none" stroke="#fff" stroke-opacity=".8"/><text text-anchor="middle" y="${r>24?3:2}" font-size="${r>24?17:14}" font-weight="800" fill="#2a3242">${it.v}</text><text text-anchor="middle" y="${r>24?17:14}" font-size="9" fill="#2a3242">sen</text></g>`}
    x+=w+10;rowH=Math.max(rowH,h);maxX=Math.max(maxX,x);
  }
  return svg(maxX-10,y+rowH,g,Math.min((maxX-10)*1.5,520));
}

/* bentuk 2D */
const SH2={
  sq:{t:T('segi empat sama','square'),s:4},re:{t:T('segi empat tepat','rectangle'),s:4},tr:{t:T('segi tiga','triangle'),s:3},
  ci:{t:T('bulatan','circle'),s:0},pe:{t:T('pentagon','pentagon'),s:5},he:{t:T('heksagon','hexagon'),s:6},oc:{t:T('oktagon','octagon'),s:8}
};
function polyPts(n,r,cx,cy,rot){return[...Array(n)].map((_,i)=>{const a=(rot+i*360/n)*Math.PI/180;return(cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1)}).join(' ')}
function shape2Svg(k){
  const f=pick(FILLS),st='stroke="#1d2540" stroke-width="4" stroke-linejoin="round"';let p;
  if(k==='sq')p=`<rect x="40" y="20" width="120" height="120" fill="${f}" ${st}/>`;
  else if(k==='re')p=`<rect x="10" y="40" width="180" height="90" fill="${f}" ${st}/>`;
  else if(k==='ci')p=`<circle cx="100" cy="80" r="66" fill="${f}" ${st}/>`;
  else if(k==='tr')p=`<polygon points="${polyPts(3,78,100,92,-90)}" fill="${f}" ${st}/>`;
  else p=`<polygon points="${polyPts(SH2[k].s,72,100,82,-90)}" fill="${f}" ${st}/>`;
  return svg(200,160,p,230);
}
/* bentuk 3D */
const SH3={
  cube:{t:T('kubus','cube'),f:6,e:12,v:8},cuboid:{t:T('kuboid','cuboid'),f:6,e:12,v:8},
  cyl:{t:T('silinder','cylinder'),f:2,e:2,v:0},cone:{t:T('kon','cone'),f:1,e:1,v:1},
  sph:{t:T('sfera','sphere'),f:0,e:0,v:0},pyr:{t:T('piramid','pyramid'),f:5,e:8,v:5}
};
function shape3Svg(k){
  const c=pick([['#7cc4ff','#4a9be0','#2f78c0'],['#ffb36b','#f08b3a','#cc6a1d'],['#9be3a8','#5cc474','#3b9a52'],['#d2b3ff','#a97cf2','#8456d4']]);
  const s='stroke="#1d2540" stroke-width="3" stroke-linejoin="round"',d='stroke="#1d2540" stroke-width="2" stroke-dasharray="6 5" fill="none"';let p='';
  if(k==='cube')p=`<polygon points="40,60 80,25 165,25 125,60" fill="${c[0]}" ${s}/><polygon points="125,60 165,25 165,110 125,145" fill="${c[2]}" ${s}/><rect x="40" y="60" width="85" height="85" fill="${c[1]}" ${s}/>`;
  else if(k==='cuboid')p=`<polygon points="15,75 50,45 185,45 150,75" fill="${c[0]}" ${s}/><polygon points="150,75 185,45 185,110 150,140" fill="${c[2]}" ${s}/><rect x="15" y="75" width="135" height="65" fill="${c[1]}" ${s}/>`;
  else if(k==='cyl')p=`<path d="M45 40V130A55 16 0 0 0 155 130V40Z" fill="${c[1]}" ${s}/><ellipse cx="100" cy="40" rx="55" ry="16" fill="${c[0]}" ${s}/><path d="M45 130A55 16 0 0 1 155 130" ${d}/>`;
  else if(k==='cone')p=`<path d="M100 15L45 130A55 16 0 0 0 155 130Z" fill="${c[1]}" ${s}/><path d="M45 130A55 16 0 0 1 155 130" ${d}/>`;
  else if(k==='sph')p=`<circle cx="100" cy="80" r="66" fill="url(#g-sph)" ${s}/><path d="M34 80A66 18 0 0 0 166 80" stroke="#1d2540" stroke-width="2" fill="none"/><path d="M34 80A66 18 0 0 1 166 80" ${d}/>`;
  else p=`<polygon points="25,140 125,140 100,20" fill="${c[1]}" ${s}/><polygon points="125,140 170,108 100,20" fill="${c[2]}" ${s}/><path d="M25 140L70 108L170 108M70 108L100 20" ${d}/>`;
  return svg(200,160,p,230);
}

/* data */
function picto(rows,unit,kind,title){
  const ic=`<svg viewBox="0 0 32 32"><use href="#i-${kind}"/></svg>`;
  const body=rows.map(r=>`<div class="pr"><span class="pn">${r.n}</span><span class="pi">${ic.repeat(r.v/unit)}</span></div>`).join('');
  return T(`<div class="picto"><div class="pt">${title.ms}</div>${body}<div class="pk">${ic}<span>mewakili ${unit} ${ITEMS.find(i=>i.id===kind).t.ms}</span></div></div>`,
           `<div class="picto"><div class="pt">${title.en}</div>${body}<div class="pk">${ic}<span>represents ${unit} ${unit===1?ITEMS.find(i=>i.id===kind).t.en.replace(/s$/,''):ITEMS.find(i=>i.id===kind).t.en}</span></div></div>`);
}
function barsSvg(rows,step,max){

  rows.forEach((r,i)=>{const x=l+gap+i*(bw+gap),h=(b-top)*r.v/max;g+=`<rect x="${x}" y="${b-h}" width="${bw}" height="${h}" rx="3" fill="${FILLS[i%6]}"/><text x="${x+bw/2}" y="${b+16}" text-anchor="middle" font-size="12" font-weight="700" fill="#24345a">${r.n}</text>`});
  return svg(W,H,g+`<line x1="${l}" x2="${l}" y1="${top-6}" y2="${b}" stroke="#24345a" stroke-width="2"/><line x1="${l}" x2="${W-6}" y1="${b}" y2="${b}" stroke="#24345a" stroke-width="2"/>`,440);
}

function dataQ(rows,vis,p,q0){

  if(r<.55){const vs=rows.map(x=>x.v),mx=Math.max(...vs),mn=Math.min(...vs),big=Math.random()<.5,t=big?mx:mn,c=rows.filter(x=>x.v===t);
    if(c.length===1)return mc({q:T(pre+(big?'Siapakah yang paling banyak?':'Siapakah yang paling sedikit?'),preE+(big?'Who has the most?':'Who has the fewest?')),vis},c[0].n,nm)}
  if(r<.8){let [a,b]=shuf(rows);if(a.v===b.v)b=rows.find(x=>x.v!==a.v)||b;if(a.v<b.v)[a,b]=[b,a];const d=a.v-b.v;
    if(d>0)return mc({q:T(pre+`Berapakah lebihnya ${a.n} berbanding ${b.n}?`,preE+`How many more does ${a.n} have than ${b.n}?`),vis},d,near(d,[1,-1,2,-2,5],0).concat([a.v,b.v,a.v+b.v]))}

}

const DEN_EN={2:['half','halves'],3:['third','thirds'],4:['quarter','quarters'],5:['fifth','fifths'],6:['sixth','sixths'],7:['seventh','sevenths'],8:['eighth','eighths'],9:['ninth','ninths'],10:['tenth','tenths']};
const UNIT_MS={mm:'milimeter',cm:'sentimeter',m:'meter',kg:'kilogram',g:'gram',ml:'mililiter',l:'liter'};
const UNIT_EN={mm:'millimetres',cm:'centimetres',m:'metres',kg:'kilograms',g:'grams',ml:'millilitres',l:'litres'};
/* Skrip suara: baca ARAHAN/SOALAN sahaja. Nombor, susunan, tanda & penukaran yang
   dipaparkan pada skrin TIDAK dibaca (kecuali operasi asas "a + b = ?"). */
const SAY_MS=[
  [/^Nombor (sebelum|selepas) (.+) ialah \.\.\.$/,'Apakah nombor $1 $2?'],
  [/^(.+) (lebih|kurang) daripada (.+) ialah \.\.\.$/,'Berapakah $1 $2 daripada $3?'],
  [/^Dua hari (sebelum|selepas) (.+) ialah \.\.\.$/,'Dua hari $1 $2 ialah hari apa?'],
  [/^Hari (sebelum|selepas) (.+) ialah \.\.\.$/,'Apakah hari $1 $2?'],
  [/^Bulan (sebelum|selepas) (.+) ialah \.\.\.$/,'Apakah bulan $1 $2?'],
  [/^Bulan ke-(\d+) dalam setahun ialah \.\.\.$/,'Apakah bulan ke-$1 dalam setahun?'],
  [/^(.+) daripada (.+) ialah \.\.\.$/,'Berapakah $1 daripada $2?'],
  [/^Digit (.+) dalam (.+) berada di tempat \.\.\.$/,'Digit $1 dalam $2 berada di nilai tempat apa?'],
  [/^(.+) pada waktu \.\.\.$/,(m,a)=>'Pada waktu apakah '+a.charAt(0).toLowerCase()+a.slice(1)+'?'],
  [/^(.+?) = \? (.+)$/,'$1 sama dengan berapa $2?'],
];
const SAY_EN=[
  [/^Two days (before|after) (.+) is \.\.\.$/,'What day is two days $1 $2?'],
  [/^The (day|month) (before|after) (.+) is \.\.\.$/,'What is the $1 $2 $3?'],
  [/^The (.+) month of the year is \.\.\.$/,'What is the $1 month of the year?'],
  [/^The digit (\S+) in (\S+) is in the \.\.\. place\.?$/,'In what place is the digit $1 in $2?'],
  [/^The sun (rise|set)s in the \.\.\.$/,'When does the sun $1?'],
  [/^The moon and (.+) appear at \.\.\.$/,'When do the moon and $1 appear?'],
  [/^We (.+?) (?:at|in the) \.\.\.$/,'When do we $1?'],
  [/^Pupils (.+?) (?:at|in the) \.\.\.$/,'When do pupils $1?'],
  [/^(.+) of (.+) is \.\.\.$/,'What is $1 of $2?'],
  [/^(.+?) = \? (.+)$/,'How many $2 are there in $1?'],
];
function sayText(q){
  const ms=ST.lang==='ms';let t=tr(q.q).replace(/ /g,'').trim();
  if(/^[\d\s.]+$/.test(t))t=ms?'Bandingkan dua nombor ini.':'Compare these two numbers.';
  const opEq=q.eq&&q.eq.replace(/ /g,'').match(/^(\d+\s*[+−×÷]\s*\d+)\s*=\s*\?$/);
  if(opEq&&/^(Berapakah hasil|What is the (sum|difference|product|quotient))/.test(t))t=ms?'Berapakah hasil '+opEq[1]+'?':'What is '+opEq[1]+'?';
  for(const [re,rep] of (ms?SAY_MS:SAY_EN))if(re.test(t)){t=t.replace(re,rep);break}
  t=t.replace(/\s*\.\.\.\s*/g,ms?' apa ':' what ').replace(/["“”]/g,'');
  t=t.replace(/RM(\d+)\.(\d\d)/g,(m,a,b)=>(+a?a+' ringgit ':'')+(+b?(+b)+' sen':'')).replace(/RM(\d+)/g,'$1 ringgit');
  t=t.replace(/(\d+)\/(\d+)/g,(m,a,b)=>{a=+a;b=+b;if(ms)return wMs(a)+' per'+wMs(b);return DEN_EN[b]?(a===1?'one '+DEN_EN[b][0]:wEn(a)+' '+DEN_EN[b][1]):a+' over '+b});
  t=t.replace(/(\d|berapa|what)\s?(mm|cm|kg|ml|m|g|l)\b/g,(m,d,u)=>d+' '+(ms?UNIT_MS:UNIT_EN)[u]);
  t=t.replace(/(\d+) (h|min)\b/g,(m,n,u)=>n+' '+(u==='h'?(+n===1?'hour':'hours'):(+n===1?'minute':'minutes')));
  t=t.replace(/\+/g,ms?' tambah ':' plus ').replace(/−/g,ms?' tolak ':' minus ').replace(/×/g,ms?' darab ':' times ').replace(/÷/g,ms?' bahagi ':' divided by ').replace(/%/g,ms?' peratus':' percent');
  t=t.replace(/\s*\(\s*(nisbah|ratio)\s*(\d+)\s*:\s*(\d+)\)/g,(m,w,a,b)=>', '+(ms?'nisbah '+a+' berbanding '+b:'ratio '+a+' to '+b));
  t=t.replace(/(\d+):(\d\d) (am|pm)/g,(m,h,mm,ap)=>h+(+mm?':'+mm:" o'clock")+' '+(ap==='am'?'a.m.':'p.m.'));
  if(!ms)t=t.replace(/\b(\d)(st|nd|rd|th)\b/g,(m,d)=>['','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth'][+d]);
  t=ms?msNums(t):enNums(t);
  if(ms)t=t.replace(/\bsetem\b/g,'stem'); // sebutan biasa
  if(ms)t=t.replace(/\bper(dua|tiga|empat|lima|enam|tujuh|lapan|sembilan|sepuluh|seratus)\b/g,'per $1');
  return t.replace(/\s+/g,' ').replace(/\s+([?.,!])/g,'$1').replace(/\.{2,}/g,'.').trim().slice(0,320);
}
function msNums(t){
  const W=n=>+n===0?'sifar':wMs(+n);
  return t.replace(/\bke-(\d+)/g,(m,n)=>+n===1?'pertama':'ke'+W(n))
   .replace(/(\d{1,2}):(\d\d)/g,(m,h,mm)=>'pukul '+W(h)+(+mm?' '+W(mm)+' minit':''))
   .replace(/(\d+)\.(\d+)/g,(m,a,b)=>W(a)+' perpuluhan '+b.split('').map(W).join(' '))
   .replace(/\d+/g,n=>W(n));
}
function enNums(t){ // nombor besar ditulis penuh supaya disebut betul (bukan 'two three four five')
  return t.replace(/(\d+)\.(\d+)/g,(m,a,b)=>wEn(+a)+' point '+b.split('').map(d=>wEn(+d)).join(' '))
   .replace(/(^|[^\d:])(\d{3,5})(?![\d:])/g,(m,p,n)=>p+wEn(+n).replace(/ thousand (?!and )/,' thousand, '));
}
const TTSC=new Map();let curAudio=null,AUD=null,VSTAT='';
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
function unlockAudio(){if(AUD)return;try{AUD=new Audio();AUD.src=SILENT;const p=AUD.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function setV(st){VSTAT=st;const b=document.querySelector('.say');if(b){b.classList.toggle('busy',st==='load');b.classList.toggle('off',st==='err'||st==='quota')}const n=document.getElementById('vnote');if(n){n.hidden=!(st==='err'||st==='quota');n.textContent=tr(st==='quota'?T('Suara cikgu sedang berehat sekejap. Cuba tekan 🔊 sebentar lagi.','The teacher’s voice is taking a short break. Try 🔊 again soon.'):T('Suara tidak dapat dimuatkan. Semak sambungan internet.','Voice can’t load. Check your internet connection.'))}}
async function sha256(t){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function ttsUrl(text,v){const k=v+ST.lang+text;if(TTSC.has(k))return TTSC.get(k);
  const p=(async()=>{
    // 1) suara yang dah dijana & lulus semakan: terus dari storan (pantas, tanpa pelayan)
    try{const L=ST.lang==='en'?'en':'ms',u=`${CFG.url}/storage/v1/object/public/tts/m2/${v}/${L}/${await sha256('v3|'+v+'|'+L+'|'+text)}.mp3`;
      const h=await fetch(u,{method:'HEAD'});if(h.ok)return u}catch(e){}
    // 2) belum ada: minta pelayan jana (dengan semakan automatik)
    const r=await fetch(CFG.url+'/functions/v1/tts',{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.key},body:JSON.stringify({text,lang:ST.lang,v})});
    if(r.ok)return(await r.json()).url;const j=await r.json().catch(()=>({}));
    throw new Error(j.error==='qc_failed'?'NONE':/429|quota|no_key/i.test(j.error||'')?'QUOTA':'NET')})();
  TTSC.set(k,p);p.catch(e=>{if(!e||e.message!=='NONE')TTSC.delete(k)});return p}

function speakView(){const vi=V.view??V.i;if(vi===V.i&&V.picked==null)return speakQ(vi);const q=V.qs[vi];ttsUrl(sayText(q),q.vo||(vi%2?'m':'f')).then(u=>{stopVoice();curAudio=AUD||new Audio();curAudio.src=u;const p=curAudio.play();if(p&&p.catch)p.catch(()=>{})}).catch(()=>setV('err'))}
function speakQ(i){if(!ST.sound||!CFG.url)return;const q=V.qs[i],v=q.vo||(i%2?'m':'f');
  setV('load');
  ttsUrl(sayText(q),v).then(u=>{if(V.v!=='play'||V.i!==i||V.picked!=null)return;stopVoice();setV('');curAudio=AUD||new Audio();curAudio.src=u;const p=curAudio.play();if(p&&p.catch)p.catch(()=>setV('tap'))}).catch(e=>{if(V.v==='play'&&V.i===i)setV(e&&e.message==='NONE'?'':e&&e.message==='QUOTA'?'quota':'err')});

async function rpc(fn,args){
  if(!CFG.url)throw new Error('NET');
  const h={'Content-Type':'application/json',apikey:CFG.key};if(!CFG.key.startsWith('sb_'))h.Authorization='Bearer '+CFG.key;
  let r;try{r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)})}catch(e){throw new Error('NET')}
  const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||'NET');return j;
}

  return `<main class="wrap play ${past?'past':''}" style="--c:${TCOL[BAB[V.id].tahun]}">${head}<section class="card"><div class="qrow"><p class="qt">${rich(q.q)}</p>${ST.sound?`<button class="say ${VSTAT==='load'&&!past?'busy':''}" data-a="say" aria-label="${tr(T('Dengar soalan','Listen'))}"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8a5 5 0 010 8M18.5 5.5a9 9 0 010 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>`:''}</div>${q.eq?`<p class="eq">${rich(q.eq)}</p>`:''}${q.vis?`<div class="vbox">${tr(q.vis)}</div>`:''}${ST.sound?`<p class="vnote" id="vnote" hidden></p>`:''}</section>
  <div class="opts ${q.opts.some(o=>!/^<svg/.test(tr(o))&&tr(o).length>14)?'wide':''} ${q.opts.some(o=>/^<svg/.test(tr(o)))?'pics':''}">${opts}</div>${fb}</main>`;
},
result(){
  const r=V.r,quiz=r.mode==='quiz',b=BAB[r.id],nextOk=!quiz&&r.stars>0&&r.s<b.st.length-1;
  let onl='';if(quiz){if(r.net==='sending')onl=`<p class="note">${tr(UI.loading)}</p>`;else if(r.net&&r.net.rank)onl=`<p class="note ok">${tr(UI.sent)} · ${tr(UI.rank)}: <b>#${r.net.rank}</b> / ${r.net.players}</p>`;else if(r.net==='queued')onl=`<p class="note">${tr(UI.queued)}</p>`;
    else if(!ST.online)onl=`<p class="note">${tr(UI.join)} <button class="link" data-a="acct">${tr(UI.register)}</button></p>`}
  const msg=r.stars===3?T('Cemerlang!','Excellent!'):r.stars===2?T('Bagus!','Great job!'):r.stars===1?T('Lulus!','You passed!'):T('Cuba lagi!','Try again!');
  return `<main class="wrap res" style="--c:${TCOL[b.tahun]}"><section class="card center"><div class="bigstars">${starRow(r.stars)}</div><h2>${tr(msg)}</h2>
  <p class="sc"><b>${r.ok}</b>/${r.n} ${tr(T('betul','correct'))}</p>${quiz?`<p class="pts big">${fmtN(r.score)} ${tr(UI.score).toLowerCase()}${r.newBest?` <em>${tr(T('Rekod baru!','New best!'))}</em>`:''}</p>`:''}
  ${!quiz&&r.stars===0?`<p class="note">${tr(UI.fail)}</p>`:''}${onl}</section>
  <div class="duo">${nextOk?`<button class="btn big" data-a="play" data-s="${r.s+1}">${tr(UI.next)}</button>`:''}${!quiz&&r.s===b.st.length-1&&quizOpen(b.id)?`<button class="btn big" data-a="quiz">${tr(UI.quiz)}</button>`:''}
  <button class="btn big alt" data-a="${quiz?'quiz':'play'}" data-s="${r.s}">${tr(UI.again)}</button><button class="btn big ghost" data-a="bab" data-id="${r.id}">${tr(UI.back)}</button></div></main>`;
},
board(){
  const tab=V.tab||'me';const tabs=`<div class="tabs"><button data-a="tab" data-t="me" class="${tab==='me'?'on':''}">${tr(UI.me)}</button><button data-a="tab" data-t="online" class="${tab==='online'?'on':''}">${tr(UI.online)}</button></div>`;
  if(tab==='me'){
    const yrs=[1,2,3].map(t=>`<h3 style="--c:${TCOL[t]}">${tr(UI.year)} ${t}</h3><table class="tbl"><tbody>${CH[t].map(b=>{const p=ST.prog[b.id];return `<tr><td>${b.n}. ${rich(b.t)}</td><td class="r">${p&&p.qb?fmtN(p.qb):'–'}</td><td class="r s">${p?babStars(b.id):0}/${babMax(b.id)} ★</td></tr>`}).join('')}</tbody></table>`).join('');
    const h=ST.hist.slice(0,10).map(x=>`<li><span>${tr(UI.year)} ${BAB[x.id].tahun} · ${rich(BAB[x.id].t)}</span><b>${fmtN(x.score)}</b><small>${x.ok}/${x.n} · ${new Date(x.at).toLocaleDateString(ST.lang==='ms'?'ms-MY':'en-MY')}</small></li>`).join('');
    return `<main class="wrap"><h2 class="ttl">${tr(UI.board)}</h2>${tabs}<div class="kpis"><div><b>${fmtN(totalPts())}</b><small>${tr(UI.total)}</small></div><div><b>${totalStars()}</b><small>${tr(UI.stars)}</small></div><div><b>${ST.hist.length}</b><small>${tr(T('Kuiz dijawab','Quizzes taken'))}</small></div></div>
    <h3>${tr(UI.recent)}</h3>${h?`<ul class="hist">${h}</ul>`:`<p class="note">${tr(UI.none)}</p>`}${yrs}</main>`;
  }
  const f=V.f||(V.f={tahun:ST.online?String(ST.online.tahun):'',bab:'',period:'week',mine:false});
  const babOpts=f.tahun?CH[+f.tahun].map(b=>`<option value="${b.id}" ${f.bab===b.id?'selected':''}>${b.n}. ${esc(tr(b.t))}</option>`).join(''):'';
  const filters=`<div class="filters"><select data-a="flt" data-k="tahun"><option value="">${tr(UI.all)}</option>${[1,2,3].map(t=>`<option value="${t}" ${f.tahun==t?'selected':''}>${tr(UI.year)} ${t}</option>`).join('')}</select>
    <select data-a="flt" data-k="bab" ${f.tahun?'':'disabled'}><option value="">${tr(UI.allBab)}</option>${babOpts}</select>
    <div class="seg"><button data-a="per" data-p="week" class="${f.period==='week'?'on':''}">${tr(UI.week)}</button><button data-a="per" data-p="all" class="${f.period==='all'?'on':''}">${tr(UI.ever)}</button></div>
    ${ST.online&&ST.online.sekolah?`<label class="tog"><input type="checkbox" data-a="mine" ${f.mine?'checked':''}> ${tr(UI.school)}</label>`:''}</div>`;
  let body;
  if(V.lb==='loading'||!V.lb)body=`<p class="note">${tr(UI.loading)}</p>`;
  else if(V.lb==='err')body=`<p class="note">${tr(UI.offline)}</p>`;
  else if(!V.lb.length)body=`<p class="note">${tr(UI.empty)}</p>`;
  else body=`<ol class="lb">${V.lb.map(r=>`<li class="${ST.online&&r.nickname===ST.online.nickname?'me':''} ${r.rank<=3?'top'+r.rank:''}"><span class="rk">${r.rank}</span><span class="who"><b>${esc(r.nickname)}</b><small>${esc(r.sekolah||'')}${r.negeri?' · '+esc(r.negeri):''} · ${tr(UI.year)} ${r.tahun}</small></span><span class="pt">${fmtN(r.points)}</span></li>`).join('')}</ol>`;
  const mine=V.my&&V.my.rank?`<div class="myrank">${tr(UI.myRank)}: <b>#${V.my.rank}</b> / ${V.my.players} ${tr(UI.players)} · ${fmtN(V.my.points)} ${tr(UI.score).toLowerCase()}</div>`:'';
  const cta=ST.online?'':`<div class="cta"><p>${tr(UI.join)}</p><button class="btn" data-a="acct">${tr(UI.register)}</button></div>`;
  if(!V.lb)V.after=loadLB;
  return `<main class="wrap"><h2 class="ttl">${tr(UI.board)}</h2>${tabs}${filters}${mine}${body}${cta}</main>`;
},
acct(){
  if(ST.online){const o=ST.online;
    return `<main class="wrap"><h2 class="ttl">${tr(UI.acct)}</h2><section class="card"><p class="who1"><b>${esc(o.nickname)}</b></p>
    <form class="form" data-f="prof"><label>${tr(UI.year)}<select id="f_t">${[1,2,3].map(t=>`<option value="${t}" ${o.tahun==t?'selected':''}>${tr(UI.year)} ${t}</option>`).join('')}</select></label>
    <label>${tr(UI.sekolah)}<input id="f_s" maxlength="60" value="${esc(o.sekolah||'')}"></label><label>${tr(UI.negeri)}<select id="f_n"><option value=""></option>${NEGERI.map(n=>`<option ${o.negeri===n?'selected':''}>${n}</option>`).join('')}</select></label>
    <p class="err" id="err">${V.err||''}</p><button class="btn">${tr(UI.saveP)}</button></form><button class="link" data-a="logout">${tr(UI.logout)}</button></section></main>`}
  const mode=V.mode||'reg';
  const tabs=`<div class="tabs"><button data-a="am" data-m="reg" class="${mode==='reg'?'on':''}">${tr(UI.register)}</button><button data-a="am" data-m="login" class="${mode==='login'?'on':''}">${tr(UI.login)}</button></div>`;
  const reg=`<form class="form" data-f="reg"><label>${tr(UI.nick)}<input id="f_k" maxlength="20" autocomplete="off" value="${esc(V.nk||ST.name||'')}" required></label>
    <label>${tr(UI.pin)}<input id="f_p" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" required></label>
    <label>${tr(UI.year)}<select id="f_t"><option value=""></option>${[1,2,3].map(t=>`<option value="${t}">${tr(UI.year)} ${t}</option>`).join('')}</select></label>
    <label>${tr(UI.sekolah)}<input id="f_s" maxlength="60" placeholder="SK …"></label><label>${tr(UI.negeri)}<select id="f_n"><option value=""></option>${NEGERI.map(n=>`<option>${n}</option>`).join('')}</select></label>
    <p class="hint">${tr(UI.pinNote)}</p><p class="err" id="err">${V.err||''}</p><button class="btn big">${tr(UI.register)}</button></form>`;
  const log=`<form class="form" data-f="login"><label>${tr(UI.nick)}<input id="f_k" maxlength="20" autocomplete="off" required></label><label>${tr(UI.pin)}<input id="f_p" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" required></label><p class="err" id="err">${V.err||''}</p><button class="btn big">${tr(UI.login)}</button></form>`;
  return `<main class="wrap"><h2 class="ttl">${tr(UI.acct)}</h2><p class="note">${tr(UI.join)}</p>${tabs}<section class="card">${mode==='reg'?reg:log}</section></main>`;
}};

/* ---------- permainan ---------- */
function makeSet(gens,n,min){ // n soalan berbeza; jika ruang soalan kecil, hanya yang unik (sekurang-kurangnya 'min')
  min=min||n;const out=[],seen=new Set(),ansN={},sig=new Set();
  const ak=q=>q.ak||okey(q.opts[q.ans]),ck=q=>okey(q.q)+'|'+(q.eq||'')+'|'+ak(q),vk=q=>okey(q.q)+'|'+(typeof q.vis==='string'?q.vis.replace(/fill="#[0-9a-f]+"/g,''):'')+(q.ak?'pic':'');
  for(let k=0;out.length<n&&k<n*60;k++){
    const q=genQ(gens(out.length)),key=ck(q);if(seen.has(key))continue; // soalan sama (isi + jawapan) tidak diulang
    const a=ak(q),used=ansN[a]||0,strict=k<n*25;
    if(used&&(strict||used>=2||sig.has(a+vk(q))))continue;
    seen.add(key);sig.add(a+vk(q));ansN[a]=used+1;out.push(q)}
  for(let k=0;out.length<n&&k<n*60;k++){const q=genQ(gens(out.length)),key=ck(q);if(!seen.has(key)){seen.add(key);out.push(q)}}
  const vs=new Set(out.map(vk));for(let k=0;out.length<min&&k<min*60;k++){const q=genQ(gens(out.length));if(!vs.has(vk(q))){vs.add(vk(q));out.push(q)}}
  while(out.length<min)out.push(genQ(gens(out.length)));return out}
/* bank soalan tetap (seeded) — supaya suara boleh dijana & disimpan awal */
const BANK_N=20,BANK_V='b2',BANKC={};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hstr(x){let h=2166136261;for(const c of x){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function stageBank(id,s){const k=id+'|'+s;if(BANKC[k])return BANKC[k];const b=BAB[id],R=Math.random;Math.random=rng(hstr(BANK_V+'|'+k));
  try{BANKC[k]=makeSet(()=>b.st[s],BANK_N,STAGE_Q).map((q,i)=>(q.vo=i%2?'m':'f',q.bk=k+'|'+i,q))}finally{Math.random=R}return BANKC[k]}
const cloneQ=q=>JSON.parse(JSON.stringify(q));
function pickBank(pools,n){ // pools: senarai bank; selang-seli suara f/m
  const used=new Set(),out=[];
  for(let i=0;out.length<n&&i<n*4;i++){const pool=shuf(pools[i%pools.length]),want=out.length%2?'m':'f';
    const q=pool.find(q=>!used.has(q.bk)&&q.vo===want)||pool.find(q=>!used.has(q.bk));if(q){used.add(q.bk);out.push(cloneQ(q))}}
  return out}
function startStage(id,s){go('play',{id,s,mode:'stage',qs:pickBank([stageBank(id,s)],STAGE_Q),i:0,view:0,rec:[],ok:0,score:0,streak:0,picked:null,t0:Date.now()})}
function startQuiz(id){const b=BAB[id],order=shuf([...b.st.keys()]);const tl=(b.tahun===1?30:25)*1000;
  go('play',{id,s:-1,mode:'quiz',qs:pickBank(order.map(s=>stageBank(id,s)),QUIZ_Q),i:0,view:0,rec:[],ok:0,score:0,streak:0,picked:null,tl,left:tl,t0:Date.now(),after:startTimer})}
function startTimer(){stopTimer();const t=++tok;let last=Date.now();timer=setInterval(()=>{if(t!==tok)return;const now=Date.now();V.left-=now-last;last=now;const el=document.getElementById('tb');if(el)el.style.width=Math.max(0,100*V.left/V.tl)+'%';if(V.left<=0){stopTimer();answer(-1)}},100)}
function answer(k){
  if(V.v!=='play'||V.picked!=null||V.view!==V.i)return;stopTimer();stopVoice();const q=V.qs[V.i],ok=k===q.ans;V.picked=k;V.right=ok;let last=0;
  if(ok){V.ok++;V.streak++;if(V.mode==='quiz'){last=100+Math.round(50*Math.max(0,V.left)/V.tl)+Math.min(50,10*(V.streak-1));V.score+=last}beep('ok')}else V.streak=0;
  V.rec[V.i]={picked:k,right:ok,fb:pick(ok?OKW:BADW),last};render();
}
function next(){if(V.v!=='play')return;stopVoice();
  if(V.view<V.i){V.view++;return render()}
  if(V.picked==null)return;tok++;V.i++;V.view=V.i;V.picked=null;if(V.i>=V.qs.length)return finish();if(V.mode==='quiz'){V.left=V.tl;V.after=startTimer}render()}
function prev(){if(V.v!=='play'||V.view<=0)return;if(V.mode==='quiz'&&!V.rec[V.i])return;stopVoice();V.view--;render()}
function finish(){
  const n=V.qs.length,stars=starsOf(V.ok,n),p=P(V.id),r={id:V.id,s:V.s,mode:V.mode,ok:V.ok,n,stars,score:V.score};
  if(V.mode==='stage'){p.st[V.s]=Math.max(p.st[V.s]||0,stars)}
  else{r.newBest=V.score>(p.qb||0);if(r.newBest){p.qb=V.score;p.qc=V.ok}p.qs=Math.max(p.qs||0,stars);
    const rec={id:V.id,score:V.score,ok:V.ok,n,ms:Date.now()-V.t0,at:Date.now()};ST.hist.unshift(rec);ST.hist=ST.hist.slice(0,50);
    if(ST.online){r.net='sending';submitScore(rec).then(j=>{r.net=j||{};if(V.v==='result'&&V.r===r)render()}).catch(e=>{if(e.message==='NET'||e.message==='TOO_FAST'){ST.pending.push(rec);save();r.net='queued'}else r.net=null;if(V.v==='result'&&V.r===r)render()})}}
  save();if(stars>0)beep('win');go('result',{id:V.id,r});
}
async function loadLB(){
  const f=V.f,a={p_tahun:f.tahun?+f.tahun:null,p_bab_id:f.bab||null,p_period:f.period,p_sekolah:f.mine&&ST.online?ST.online.sekolah:null};const stamp=++tok;
  V.lb='loading';V.my=null;
  try{const [lb,my]=await Promise.all([rpc('mk_leaderboard',Object.assign({p_limit:50},a)),ST.online?rpc('mk_my_rank',Object.assign({p_token:ST.online.token},a)):null]);if(stamp!==tok||V.v!=='board')return;V.lb=lb||[];V.my=my}
  catch(e){if(stamp!==tok||V.v!=='board')return;V.lb='err'}render();
}

/* ---------- acara ---------- */
const ACT={
 home:()=>go('home'),back:()=>{const [v,p]=backOf();go(v,p)},none:()=>{},
 lang:d=>{if(!EN_ON)return;ST.lang=d.l;save();stopVoice();V.saidI=null;document.documentElement.lang=d.l==='ms'?'ms':'en';const keep=V.after;render()},
 sound:()=>{ST.sound=!ST.sound;save();if(!ST.sound)stopVoice();V.saidI=V.i;render()},
 rename:()=>{ST.name='';save();render()},
 year:d=>go('year',{t:+d.t}),bab:d=>go('bab',{id:d.id}),
 play:d=>startStage(V.id||V.r.id,+d.s),quiz:()=>startQuiz(V.id||V.r.id),
 ans:d=>answer(+d.k),say:()=>{if(V.v==='play')speakView()},next:()=>next(),prev:()=>prev(),
 board:()=>go('board',{tab:'me'}),tab:d=>{V.tab=d.t;V.lb=null;render()},
 per:d=>{V.f.period=d.p;V.lb=null;render()},
 acct:()=>go('acct',{mode:'reg'}),am:d=>{V.mode=d.m;V.err='';render()},
 logout:()=>{ST.online=null;save();go('acct',{mode:'login'})}
};
app.addEventListener('click',e=>{unlockAudio();const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT'||(b.tagName==='INPUT'))return;const f=ACT[b.dataset.a];if(f){e.preventDefault();f(b.dataset)}});
app.addEventListener('change',e=>{const el=e.target,a=el.dataset.a;
  if(a==='openAll'){ST.openAll=el.checked;save();render()}
  else if(a==='flt'){V.f[el.dataset.k]=el.value;if(el.dataset.k==='tahun')V.f.bab='';V.lb=null;render()}
  else if(a==='mine'){V.f.mine=el.checked;V.lb=null;render()}});
app.addEventListener('submit',async e=>{e.preventDefault();const f=e.target.dataset.f,$=id=>{const x=document.getElementById(id);return x?x.value.trim():''};
  if(f==='name'){const n=$('nm');if(n){ST.name=n.slice(0,20);save();render()}return}
  const btn=e.target.querySelector('button.btn');if(btn)btn.disabled=true;const err=document.getElementById('err');
  try{let o;
    if(f==='reg'){if(!$('f_t'))throw new Error('BAD_TAHUN');o=await rpc('mk_register',{p_nickname:$('f_k'),p_tahun:+$('f_t'),p_sekolah:$('f_s'),p_negeri:$('f_n'),p_pin:$('f_p')})}
    else if(f==='login')o=await rpc('mk_login',{p_nickname:$('f_k'),p_pin:$('f_p')});
    else if(f==='prof')o=await rpc('mk_update_profile',{p_token:ST.online.token,p_tahun:+$('f_t'),p_sekolah:$('f_s'),p_negeri:$('f_n')});
    ST.online=o;if(!ST.name)ST.name=o.nickname;save();flushPending();go('board',{tab:'online'});
  }catch(x){if(err)err.textContent=errMsg(x);if(btn)btn.disabled=false}});
document.addEventListener('keydown',e=>{if(V.v!=='play')return;if(e.key==='ArrowLeft'){prev();return}if(e.key==='ArrowRight'||((e.key==='Enter'||e.key===' ')&&V.rec[V.view??V.i])){e.preventDefault();next();return}if(V.picked==null&&V.view===V.i&&/^[1-4]$/.test(e.key)){const k=+e.key-1;if(k<V.qs[V.i].opts.length)answer(k)}});
document.documentElement.lang=ST.lang==='ms'?'ms':'en';
render();setTimeout(flushPending,3000);

}
